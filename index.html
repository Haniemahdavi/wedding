<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوت‌نامه</title>
<!-- متن پیش‌نمایش لینک در تلگرام/واتساپ (اختیاری، دستی ویرایش کنید) -->
<meta property="og:title" content="دعوت‌نامه‌ی عروسی هانیه و محمد">
<meta property="og:description" content="با افتخار از حضور شما دعوت می‌کنیم">
<meta name="theme-color" content="#3f4234">
<link rel="preload" href="assets/fonts/noto-nastaliq-urdu-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/mirza-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>

<!-- ====== قطعه‌های گرافیکی مشترک (گل یاس، برگ، نقش برجسته) ====== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gPetal" cx="50%" cy="85%" r="90%">
      <stop offset="0" stop-color="#f6eedd"/>
      <stop offset=".45" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </radialGradient>
    <linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f3826"/>
      <stop offset="1" stop-color="#4f5b3c"/>
    </linearGradient>
    <radialGradient id="gSeal" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#c7a676"/>
      <stop offset=".5" stop-color="#8d6a3f"/>
      <stop offset="1" stop-color="#4b3720"/>
    </radialGradient>
    <radialGradient id="gSealIn" cx="60%" cy="65%" r="70%">
      <stop offset="0" stop-color="#a8865a"/>
      <stop offset="1" stop-color="#5c4428"/>
    </radialGradient>

    <!-- یک گل یاس -->
    <g id="fl">
      <g stroke="rgba(110,90,60,.28)" stroke-width=".7" fill="url(#gPetal)">
        <path id="pt" d="M0 0 C-7 -7 -8 -19 0 -23 C8 -19 7 -7 0 0Z"/>
        <use href="#pt" transform="rotate(72)"/>
        <use href="#pt" transform="rotate(144)"/>
        <use href="#pt" transform="rotate(216)"/>
        <use href="#pt" transform="rotate(288)"/>
      </g>
      <circle r="3.4" fill="#d7b04c"/>
      <circle r="1.5" fill="#a9822b"/>
    </g>
    <!-- غنچه -->
    <g id="bd">
      <path d="M0 0 C-4 -5 -4 -13 0 -17 C4 -13 4 -5 0 0Z" fill="#f4ead8" stroke="rgba(110,90,60,.3)" stroke-width=".6"/>
      <path d="M0 0 L0 6" stroke="#4f5b3c" stroke-width="1.4"/>
    </g>
    <!-- برگ -->
    <g id="lf">
      <path d="M0 0 C10 -9 28 -9 40 0 C28 9 10 9 0 0Z" fill="url(#gLeaf)"/>
      <path d="M3 0 Q20 -1 37 0" stroke="rgba(255,255,255,.16)" stroke-width=".8" fill="none"/>
    </g>

    <!-- شاخه‌ی یاس -->
    <g id="sprig">
      <g fill="none" stroke="#4a3f2c" stroke-linecap="round">
        <path d="M-10 -10 C50 30 100 60 160 130 C190 165 205 200 215 240" stroke-width="2.4"/>
        <path d="M60 38 C80 20 110 10 140 12" stroke-width="1.6"/>
        <path d="M110 78 C140 70 170 80 195 95" stroke-width="1.6"/>
        <path d="M160 130 C150 160 140 185 120 205" stroke-width="1.6"/>
        <path d="M195 190 C215 200 232 215 240 238" stroke-width="1.3"/>
      </g>
      <use href="#lf" transform="translate(28 10) rotate(-25)"/>
      <use href="#lf" transform="translate(40 26) rotate(60)"/>
      <use href="#lf" transform="translate(80 30) rotate(-55)"/>
      <use href="#lf" transform="translate(92 66) rotate(95)"/>
      <use href="#lf" transform="translate(128 92) rotate(-20)"/>
      <use href="#lf" transform="translate(140 112) rotate(120) scale(.9)"/>
      <use href="#lf" transform="translate(172 155) rotate(15) scale(.9)"/>
      <use href="#lf" transform="translate(186 180) rotate(150) scale(.85)"/>
      <use href="#lf" transform="translate(205 215) rotate(30) scale(.8)"/>
      <use href="#lf" transform="translate(150 150) rotate(150) scale(.8)"/>
      <use href="#bd" transform="translate(150 6) rotate(70)"/>
      <use href="#bd" transform="translate(205 84) rotate(40)"/>
      <use href="#bd" transform="translate(108 226) rotate(-130)"/>
      <use href="#bd" transform="translate(244 236) rotate(150)"/>
      <use href="#fl" transform="translate(140 12) scale(.9) rotate(10)"/>
      <use href="#fl" transform="translate(116 0) scale(.62) rotate(40)"/>
      <use href="#fl" transform="translate(163 24) scale(.6) rotate(-15)"/>
      <use href="#fl" transform="translate(196 96) scale(1) rotate(20)"/>
      <use href="#fl" transform="translate(220 116) scale(.7)"/>
      <use href="#fl" transform="translate(176 78) scale(.55) rotate(30)"/>
      <use href="#fl" transform="translate(120 206) scale(.95) rotate(-10)"/>
      <use href="#fl" transform="translate(96 220) scale(.62) rotate(25)"/>
      <use href="#fl" transform="translate(140 228) scale(.58)"/>
      <use href="#fl" transform="translate(216 242) scale(.85) rotate(12)"/>
      <use href="#fl" transform="translate(238 264) scale(.55) rotate(50)"/>
    </g>

    <!-- نقش‌های برجسته (فقط خط؛ رنگ از بیرون می‌آید) -->
    <g id="corner" fill="none">
      <path d="M4 96 C4 56 12 24 44 10 C60 3 78 4 96 4"/>
      <path d="M44 10 C33 19 35 32 46 31 C54 30 54 20 47 20"/>
      <path d="M12 52 C24 50 30 60 23 66 C17 71 11 63 17 60"/>
      <path d="M22 36 C30 30 40 34 38 42"/>
      <path d="M60 6 C64 14 74 16 80 12"/>
      <path d="M8 74 C14 78 16 88 12 92"/>
      <path d="M28 22 C32 14 42 12 46 16 M18 30 C14 24 16 16 22 14"/>
    </g>
    <g id="lo">
      <path d="M0 0 C8 -10 26 -10 36 0 C26 10 8 10 0 0Z"/>
      <path d="M4 0 Q18 -1 32 0"/>
    </g>
    <g id="frond" fill="none">
      <path d="M100 300 C98 230 102 150 100 40 C99 25 104 14 112 6"/>
      <use href="#lo" transform="translate(100 260) rotate(-140)"/>
      <use href="#lo" transform="translate(100 240) rotate(-40)"/>
      <use href="#lo" transform="translate(100 205) rotate(-145)"/>
      <use href="#lo" transform="translate(100 185) rotate(-35)"/>
      <use href="#lo" transform="translate(100 150) rotate(-150)"/>
      <use href="#lo" transform="translate(100 130) rotate(-30)"/>
      <use href="#lo" transform="translate(100 98) rotate(-150) scale(.85)"/>
      <use href="#lo" transform="translate(100 80) rotate(-30) scale(.85)"/>
      <use href="#lo" transform="translate(101 52) rotate(-140) scale(.7)"/>
      <use href="#lo" transform="translate(101 40) rotate(-40) scale(.7)"/>
      <path d="M100 270 C70 250 50 262 40 240 C34 226 46 216 54 226"/>
      <path d="M100 222 C130 205 150 218 160 196 C166 182 154 174 146 184"/>
    </g>
    <g id="scroll" fill="none">
      <path d="M0 20 C25 4 45 36 70 20 S115 4 140 20 S185 36 200 20"/>
      <path d="M70 20 C64 10 52 12 54 20 C56 26 64 24 62 18"/>
      <path d="M140 20 C146 30 158 28 156 20 C154 14 146 16 148 22"/>
      <use href="#lo" transform="translate(30 14) rotate(-50) scale(.45)"/>
      <use href="#lo" transform="translate(105 14) rotate(-130) scale(.45)"/>
      <use href="#lo" transform="translate(175 26) rotate(40) scale(.45)"/>
    </g>

    <!-- آیکون‌ها -->
    <g id="icCal" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="26" height="23" rx="3"/><path d="M3 11h26M9 2v6M23 2v6"/>
      <path d="M8 16h3M14.5 16h3M21 16h3M8 21.5h3M14.5 21.5h3M21 21.5h3"/>
    </g>
    <g id="icClock" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <circle cx="16" cy="16" r="13"/><path d="M16 8v8l6 4"/>
    </g>
    <g id="icDish" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 23a11 11 0 0 1 22 0Z"/><path d="M2 27h28M16 9V7M13.5 6.5h5"/>
    </g>
    <g id="icPin">
      <path d="M16 1C9 1 4 6.3 4 13c0 8.6 12 20 12 20s12-11.4 12-20C28 6.3 23 1 16 1Z" fill="#4a3c2c"/>
      <circle cx="16" cy="13" r="4.6" fill="#efe6d6"/>
    </g>
    <g id="icMap" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <path d="M3 7l8-3 10 3 8-3v21l-8 3-10-3-8 3Z"/><path d="M11 4v21M21 7v21"/>
    </g>

    <!-- سایه‌ی برگ‌ها روی کاغذ -->
    <g id="shadowBranch" fill="#000">
      <path d="M-20 10 C80 60 160 90 260 200 C300 240 330 290 360 340" stroke="#000" stroke-width="5" fill="none"/>
      <path d="M90 60 C130 20 170 0 230 -10" stroke="#000" stroke-width="4" fill="none"/>
      <use href="#lf" transform="translate(30 30) rotate(-40) scale(2.2)"/>
      <use href="#lf" transform="translate(60 40) rotate(70) scale(2)"/>
      <use href="#lf" transform="translate(120 70) rotate(-60) scale(2.4)"/>
      <use href="#lf" transform="translate(140 30) rotate(-20) scale(1.8)"/>
      <use href="#lf" transform="translate(190 8) rotate(-80) scale(1.8)"/>
      <use href="#lf" transform="translate(170 110) rotate(100) scale(2.2)"/>
      <use href="#lf" transform="translate(220 160) rotate(-10) scale(2.3)"/>
      <use href="#lf" transform="translate(250 200) rotate(120) scale(2)"/>
      <use href="#lf" transform="translate(290 250) rotate(20) scale(2.1)"/>
      <use href="#lf" transform="translate(310 290) rotate(130) scale(1.9)"/>
    </g>
  </defs>
</svg>

<div class="phone" id="phone">

  <!-- دکمه‌ی آهنگ -->
  <button class="music" id="musicBtn" aria-label="پخش/توقف آهنگ" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 17.5V5.8l10-2.3v11.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="6.6" cy="17.6" rx="2.6" ry="2.1" fill="currentColor"/><ellipse cx="16.6" cy="15.3" rx="2.6" ry="2.1" fill="currentColor"/></svg>
    <span class="mute-line"></span>
  </button>
  <audio id="audio" loop preload="auto"></audio>

  <!-- ================= صفحه‌ی پاکت ================= -->
  <section class="intro fabric" id="intro">
    <svg class="leafshadow ls-1" viewBox="-40 -40 420 400" aria-hidden="true"><use href="#shadowBranch"/></svg>
    <svg class="sprig sp-intro-top" viewBox="-20 -20 280 300" aria-hidden="true"><use href="#sprig"/></svg>
    <svg class="sprig sp-intro-bot" viewBox="-20 -20 280 300" aria-hidden="true"><use href="#sprig"/></svg>

    <div class="env-stage" id="envStage" role="button" tabindex="0" aria-label="باز کردن دعوت‌نامه">
      <div class="env" id="env">
        <div class="env-back paper"></div>

        <div class="env-card paper">
          <div class="mini-frame">
            <svg class="mono-svg" viewBox="0 0 60 60"><path d="M30 4 L52 30 L30 56 L8 30Z" fill="none" stroke="currentColor" stroke-width="1"/><path d="M30 9 L47 30 L30 51 L13 30Z" fill="none" stroke="currentColor" stroke-width=".6"/><text x="30" y="35" text-anchor="middle" class="mono-txt" data-bind="monogram"></text></svg>
            <div class="mini-names nastaliq" data-bind="names"></div>
          </div>
        </div>

        <div class="env-front paper">
          <svg class="env-folds" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0 L50 50 L100 0" fill="none" stroke="rgba(120,100,70,.18)" stroke-width=".4" vector-effect="non-scaling-stroke"/><path d="M0 100 L42 58 M100 100 L58 58" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>
          <div class="guest">
            <div class="guest-1" id="guest1"></div>
            <div class="guest-2" id="guest2"></div>
            <div class="divider small"><span></span><i>✦</i><span></span></div>
          </div>
        </div>

        <div class="flap-wrap" id="flap">
          <div class="flap paper">
            <svg class="flap-art" viewBox="0 0 400 220" preserveAspectRatio="xMidYMin meet" aria-hidden="true">
              <g class="emb"><g transform="translate(70 -40) rotate(-62) scale(.7)"><use href="#frond"/></g></g>
              <g class="emb"><g transform="translate(330 -40) scale(-1 1) rotate(-62) scale(.7)"><use href="#frond"/></g></g>
              <g class="emb"><g transform="translate(120 30) scale(.8)"><use href="#scroll"/></g></g>
            </svg>
          </div>
        </div>

        <div class="seal" id="seal">
          <svg viewBox="-50 -50 100 100">
            <path d="M0 -46 C14 -47 22 -40 32 -36 C42 -30 47 -18 46 -4 C48 10 44 22 36 32 C26 42 14 47 0 46 C-14 48 -26 42 -35 34 C-44 24 -48 12 -46 -2 C-47 -16 -42 -28 -32 -36 C-22 -43 -12 -45 0 -46Z" fill="url(#gSeal)"/>
            <circle r="33" fill="url(#gSealIn)"/>
            <circle r="33" fill="none" stroke="rgba(255,230,190,.35)" stroke-width="1.2"/>
            <circle r="29" fill="none" stroke="rgba(40,25,10,.45)" stroke-width="1"/>
            <g stroke="#d9bb8a" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".9">
              <path d="M0 22 L0 -22"/>
              <path d="M0 12 C-8 10 -12 6 -14 0 M0 12 C8 10 12 6 14 0 M0 0 C-7 -2 -10 -6 -11 -12 M0 0 C7 -2 10 -6 11 -12 M0 -10 C-5 -12 -6 -16 -6 -20 M0 -10 C5 -12 6 -16 6 -20"/>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <div class="tap-hint" id="tapHint">
      <svg viewBox="0 0 32 40" width="30" height="38" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V7a2.5 2.5 0 0 1 5 0v11"/><path d="M17 15a2.5 2.5 0 0 1 5 0v4"/><path d="M22 17a2.5 2.5 0 0 1 5 0v8c0 7-4 11-10 11s-8-3-11-8l-3-5a2.4 2.4 0 0 1 4-2.6L12 24"/><path d="M8 6a6 6 0 0 1 13 0" opacity=".55"/></g></svg>
      <span>برای باز کردن لمس کنید</span>
    </div>
  </section>

  <!-- ================= محتوای اصلی ================= -->
  <main class="scroller" id="scroller">

    <!-- ۱. کارت -->
    <section class="page fabric">
      <svg class="leafshadow ls-2" viewBox="-40 -40 420 400" aria-hidden="true"><use href="#shadowBranch"/></svg>
      <svg class="sprig sp-card" viewBox="-20 -20 280 300" aria-hidden="true"><use href="#sprig"/></svg>
      <div class="card paper reveal">
        <svg class="frame" viewBox="0 0 100 140" preserveAspectRatio="none" aria-hidden="true">
          <rect x="4" y="4" width="92" height="132" fill="none" stroke="rgba(120,100,70,.25)" stroke-width=".35" vector-effect="non-scaling-stroke"/>
          <rect x="5.5" y="5.5" width="89" height="129" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1" vector-effect="non-scaling-stroke"/>
        </svg>
        <svg class="corner c-tr" viewBox="0 0 100 100"><g class="emb"><use href="#corner"/></g></svg>
        <svg class="corner c-tl" viewBox="0 0 100 100"><g class="emb"><use href="#corner"/></g></svg>
        <svg class="corner c-br" viewBox="0 0 100 100"><g class="emb"><use href="#corner"/></g></svg>
        <svg class="corner c-bl" viewBox="0 0 100 100"><g class="emb"><use href="#corner"/></g></svg>

        <div class="card-body">
          <div class="monogram r1">
            <svg viewBox="0 0 80 80"><g fill="none" stroke="currentColor"><path d="M40 6 L70 40 L40 74 L10 40Z" stroke-width="1.1"/><path d="M40 12 L64 40 L40 68 L16 40Z" stroke-width=".6"/><path d="M40 6 C34 0 28 2 30 6 M40 6 C46 0 52 2 50 6 M40 74 C34 80 28 78 30 74 M40 74 C46 80 52 78 50 74" stroke-width=".8"/></g><text x="40" y="47" text-anchor="middle" class="mono-txt big" data-bind="monogram"></text></svg>
          </div>
          <h1 class="names nastaliq r2" data-bind="names"></h1>
          <div class="divider r3"><span></span><i>✦</i><span></span></div>
          <p class="poem r4" data-bind="poem"></p>
        </div>
      </div>
      <div class="swipe" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6M6 21l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </section>

    <!-- ۲. جزئیات -->
    <section class="page paper sheet">
      <svg class="leafshadow ls-3" viewBox="-40 -40 420 400" aria-hidden="true"><use href="#shadowBranch"/></svg>
      <svg class="sprig sp-det" viewBox="-20 -20 280 300" aria-hidden="true"><use href="#sprig"/></svg>
      <svg class="sheet-frame" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect x="3" y="2" width="94" height="96" fill="none" stroke="rgba(120,100,70,.22)" stroke-width=".4" vector-effect="non-scaling-stroke"/></svg>
      <svg class="corner c-bl small" viewBox="0 0 100 100"><g class="emb"><use href="#corner"/></g></svg>
      <svg class="corner c-br small" viewBox="0 0 100 100"><g class="emb"><use href="#corner"/></g></svg>

      <div class="content reveal">
        <div class="monogram sm r1"><svg viewBox="0 0 80 80"><g fill="none" stroke="currentColor"><path d="M40 6 L70 40 L40 74 L10 40Z" stroke-width="1.3"/><path d="M40 13 L63 40 L40 67 L17 40Z" stroke-width=".7"/></g><text x="40" y="48" text-anchor="middle" class="mono-txt big" data-bind="monogram"></text></svg></div>
        <p class="welcome r4" data-bind="welcomeLines"></p>
        <div class="divider r4"><span></span><i>✦</i><span></span></div>
        <ul class="facts">
          <li class="r5"><svg viewBox="0 0 32 32"><use href="#icCal"/></svg><span data-bind="date"></span></li>
          <li class="r6"><svg viewBox="0 0 32 32"><use href="#icClock"/></svg><span data-bind="time"></span></li>
          <li class="r7"><svg viewBox="0 0 32 32"><use href="#icDish"/></svg><span data-bind="dinner"></span></li>
        </ul>
        <div class="divider r7"><span></span><i>✦</i><span></span></div>
      </div>
      <div class="swipe" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6M6 21l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </section>

    <!-- ۳. موقعیت مکانی -->
    <section class="page paper sheet">
      <svg class="leafshadow ls-4" viewBox="-40 -40 420 400" aria-hidden="true"><use href="#shadowBranch"/></svg>
      <svg class="sprig sp-loc-top" viewBox="-20 -20 280 300" aria-hidden="true"><use href="#sprig"/></svg>
      <svg class="sprig sp-loc-bot" viewBox="-20 -20 280 300" aria-hidden="true"><use href="#sprig"/></svg>
      <div class="content reveal">
        <h2 class="title r1">موقعیت مکانی</h2>
        <a class="map r2" id="mapCard" target="_blank" rel="noopener">
          <svg viewBox="0 0 300 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <rect width="300" height="260" fill="#ebe7dc"/>
            <g fill="#cfd8bf"><path d="M180 20 L270 40 L260 120 L190 110Z"/><path d="M20 180 L80 170 L95 240 L30 250Z"/><path d="M200 190 L280 185 L285 240 L210 248Z"/><rect x="120" y="200" width="40" height="30" transform="rotate(-12 140 215)"/><rect x="40" y="40" width="34" height="26" transform="rotate(-12 57 53)"/></g>
            <g stroke="#f8f6f0" stroke-width="5" fill="none" transform="rotate(-12 150 130)"><path d="M-40 60H340M-40 120H340M-40 180H340M-40 230H340M40 -40V300M110 -40V300M190 -40V300M250 -40V300"/></g>
            <g stroke="#f8f6f0" stroke-width="2.5" fill="none" transform="rotate(-12 150 130)"><path d="M-40 90H340M-40 150H340M-40 205H340M75 -40V300M150 -40V300M220 -40V300"/></g>
            <path d="M165 -10 C150 40 140 70 160 110 C185 160 250 190 320 205" stroke="#bccbd0" stroke-width="10" fill="none"/>
            <path d="M120 -10 C130 50 150 90 210 120 C250 140 290 170 320 180" stroke="#fff" stroke-width="7" fill="none"/>
            <path d="M120 -10 C130 50 150 90 210 120 C250 140 290 170 320 180" stroke="#e2ddd0" stroke-width="1" fill="none"/>
            <g transform="translate(70 92)" stroke="#5a4a36" fill="none" opacity=".55" stroke-width="1"><path d="M0 0 H60 M30 -6 C24 -12 18 -8 22 -4 M30 -6 C36 -12 42 -8 38 -4"/></g>
          </svg>
          <div class="pin"><svg viewBox="0 0 32 34" width="36" height="38"><use href="#icPin"/></svg><b data-bind="venueName"></b></div>
        </a>
        <p class="address r3" data-bind="address"></p>
        <div class="map-buttons r4" id="mapButtons"></div>
      </div>
      <div class="swipe" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6M6 21l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </section>

    <!-- ۴. پایان -->
    <section class="page paper sheet closing">
      <svg class="leafshadow ls-5" viewBox="-40 -40 420 400" aria-hidden="true"><use href="#shadowBranch"/></svg>
      <svg class="sprig sp-end-top" viewBox="-20 -20 280 300" aria-hidden="true"><use href="#sprig"/></svg>
      <svg class="sprig sp-end-side" viewBox="-20 -20 280 300" aria-hidden="true"><use href="#sprig"/></svg>
      <div class="content reveal">
        <div class="ornament r1">❖</div>
        <h2 class="closing-text r2" data-bind="closing"></h2>
        <div class="divider r3"><span></span><i>✦</i><span></span></div>
        <p class="sign nastaliq r4" data-bind="names"></p>
      </div>
      <svg class="emb-panel" viewBox="0 0 200 300" aria-hidden="true">
        <g class="emb"><use href="#frond"/></g>
        <g class="emb"><g transform="translate(200 40) scale(-.75 .75)"><use href="#frond"/></g></g>
        <g class="emb"><g transform="translate(10 90) scale(.6)"><use href="#frond"/></g></g>
      </svg>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
